<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1170" viewBox="0 0 1440 1170" role="img" aria-labelledby="title desc">
<title id="title">DeepSeek V4.1 Flash：Full、Reuse、Reindex 的层间数据流</title>
<desc id="desc">固定当前Token，展开Decoder第21到28层：第21层Full从最终Encoder输出生成一份10000条记录的全局KV和indexer K，并选择512个编号I_A；后面的Reuse共用全局缓存和I_A；第25层Reindex共用全局缓存，以自己的Indexer重选512个编号I_B；其后Reuse沿用I_B。每层有自己的Query和128条局部SWA缓存，主Attention读取所选512条全局记录与本层128条局部记录，Hidden State逐层更新。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#64748b"/></marker>
<marker id="cache-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#ca8738"/></marker>
<style>
text{font-family:Arial,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43}
.title{font-size:34px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#53657a}.tiny{font-size:18px;fill:#53657a}
.bold{font-weight:700}.center{text-anchor:middle}
.cache{fill:#fff3e3;stroke:#d99a50;stroke-width:2}.activation{fill:#edf5ff;stroke:#80a9da;stroke-width:2}
.operation{fill:#f1f4f8;stroke:#ccd5df;stroke-width:1.5}.index{fill:#edf9f1;stroke:#72b286;stroke-width:2}
.flow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
.read{fill:none;stroke:#ca8738;stroke-width:3;marker-end:url(#cache-arrow)}
</style></defs>
<rect width="1440" height="1170" fill="white"/>

<text x="44" y="52" class="title" >DeepSeek V4.1：一份全局 KV，多层共读；每层有自己的局部 KV</text>
<text x="44" y="89" class="small" >固定当前 Token，展开 Decoder 第 21–28 层。例中序列有 10000 个位置，Decoder 全局池有 10000 条 KV。</text>
<rect x="60" y="130" width="310" height="62" rx="12" class="activation"/>
<text x="215" y="156" class="body bold center" >最终 Encoder 输出</text>
<text x="215" y="182" class="small center" >全局 KV 的来源</text>
<path d="M215 192 V239" class="flow"/>
<text x="231" y="223" class="tiny" >Full 层的全局投影</text>
<rect x="475" y="130" width="590" height="62" rx="12" class="activation"/>
<text x="770" y="156" class="body bold center" >当前 Token 的 Hidden State</text>
<text x="770" y="182" class="small center" >进入第 21 层</text>
<path d="M770 192 V239" class="flow"/>
<text x="1255" y="181" class="body bold center" >每层独立保存</text>
<text x="1255" y="211" class="small center" >最近 128 个位置的 SWA KV</text>
<rect x="60" y="240" width="310" height="710" rx="12" class="cache"/>
<text x="215" y="282" class="body bold center" >全局池 G：只存一份</text>
<text x="215" y="322" class="body bold center" >10000 条记录</text>
<text x="215" y="356" class="small center" >主 KV + indexer K</text>
<rect x="88" y="380" width="254" height="39" rx="7" class="cache"/>
<text x="215" y="407" class="body center" >KV₁</text>
<rect x="88" y="430" width="254" height="39" rx="7" class="cache"/>
<text x="215" y="457" class="body center" >KV₂</text>
<rect x="88" y="480" width="254" height="39" rx="7" class="cache"/>
<text x="215" y="507" class="body center" >…</text>
<rect x="88" y="530" width="254" height="39" rx="7" class="cache"/>
<text x="215" y="557" class="body center" >KV₁₀₀₀₀</text>
<text x="215" y="620" class="body center" >Full 建立这一份</text>
<text x="215" y="654" class="small center" >Reuse / Reindex 共用</text>
<text x="215" y="726" class="small center" >未选中的条目继续保存</text>
<text x="215" y="758" class="small center" >Top-512 只决定本层读谁</text>
<text x="215" y="856" class="body bold center" >第 21–40 层共享 G</text>
<text x="215" y="890" class="small center" >后续层无需另存全局副本</text>
<path d="M370 580 H416 M416 312 V882" fill="none" stroke="#ca8738" stroke-width="3"/>
<rect x="475" y="240" width="590" height="140" rx="12" class="activation"/>
<text x="495" y="271" class="body bold" >第 21 层 · Full</text>
<rect x="912" y="250" width="134" height="31" rx="7" class="index"/>
<text x="979" y="272" class="tiny bold center" style="fill:#2e7047">I_A · 512 个编号</text>
<text x="495" y="304" class="small" >建立全局池 G；自己的 Indexer 选 I_A</text>
<text x="495" y="338" class="body" >本层 Q 读取：512 条全局 + 本层 128 条局部</text>
<text x="495" y="366" class="small" >Attention → 输出投影 / 残差 / MoE → 新 Hidden State</text>
<path d="M416 312 H474" class="read"/>
<rect x="1130" y="246" width="250" height="128" rx="12" class="cache"/>
<text x="1255" y="279" class="small bold center" >第 21 层 SWA</text>
<text x="1255" y="316" class="body bold center" >128 条 KV</text>
<text x="1255" y="349" class="tiny center" >第 9873–10000 个位置</text>
<path d="M1130 339 H1066" class="read"/>
<path d="M770 380 V429" class="flow"/>
<text x="790" y="412" class="tiny" >h²¹（当前 Token）</text>
<rect x="475" y="430" width="590" height="140" rx="12" class="activation"/>
<text x="495" y="461" class="body bold" >第 22–24 层 · Reuse</text>
<rect x="912" y="440" width="134" height="31" rx="7" class="index"/>
<text x="979" y="462" class="tiny bold center" style="fill:#2e7047">I_A · 512 个编号</text>
<text x="495" y="494" class="small" >共享 G，并直接沿用 I_A；不再运行 Indexer</text>
<text x="495" y="528" class="body" >本层 Q 读取：512 条全局 + 本层 128 条局部</text>
<text x="495" y="556" class="small" >Attention → 输出投影 / 残差 / MoE → 新 Hidden State</text>
<path d="M416 502 H474" class="read"/>
<rect x="1130" y="436" width="250" height="128" rx="12" class="cache"/>
<text x="1255" y="469" class="small bold center" >第 22、23、24 层</text>
<text x="1255" y="506" class="body bold center" >每层各 128 条 KV</text>
<text x="1255" y="539" class="tiny center" >三个独立窗口</text>
<path d="M1130 529 H1066" class="read"/>
<path d="M770 570 V619" class="flow"/>
<text x="790" y="602" class="tiny" >h²⁴（当前 Token）</text>
<rect x="475" y="620" width="590" height="140" rx="12" class="activation"/>
<text x="495" y="651" class="body bold" >第 25 层 · Reindex</text>
<rect x="912" y="630" width="134" height="31" rx="7" class="index"/>
<text x="979" y="652" class="tiny bold center" style="fill:#2e7047">I_B · 512 个编号</text>
<text x="495" y="684" class="small" >共享 G；自己的 Indexer 重选 I_B（可不同）</text>
<text x="495" y="718" class="body" >本层 Q 读取：512 条全局 + 本层 128 条局部</text>
<text x="495" y="746" class="small" >Attention → 输出投影 / 残差 / MoE → 新 Hidden State</text>
<path d="M416 692 H474" class="read"/>
<rect x="1130" y="626" width="250" height="128" rx="12" class="cache"/>
<text x="1255" y="659" class="small bold center" >第 25 层 SWA</text>
<text x="1255" y="696" class="body bold center" >128 条 KV</text>
<text x="1255" y="729" class="tiny center" >第 9873–10000 个位置</text>
<path d="M1130 719 H1066" class="read"/>
<path d="M770 760 V809" class="flow"/>
<text x="790" y="792" class="tiny" >h²⁵（当前 Token）</text>
<rect x="475" y="810" width="590" height="140" rx="12" class="activation"/>
<text x="495" y="841" class="body bold" >第 26–28 层 · Reuse</text>
<rect x="912" y="820" width="134" height="31" rx="7" class="index"/>
<text x="979" y="842" class="tiny bold center" style="fill:#2e7047">I_B · 512 个编号</text>
<text x="495" y="874" class="small" >共享 G，并直接沿用 I_B；不再运行 Indexer</text>
<text x="495" y="908" class="body" >本层 Q 读取：512 条全局 + 本层 128 条局部</text>
<text x="495" y="936" class="small" >Attention → 输出投影 / 残差 / MoE → 新 Hidden State</text>
<path d="M416 882 H474" class="read"/>
<rect x="1130" y="816" width="250" height="128" rx="12" class="cache"/>
<text x="1255" y="849" class="small bold center" >第 26、27、28 层</text>
<text x="1255" y="886" class="body bold center" >每层各 128 条 KV</text>
<text x="1255" y="919" class="tiny center" >三个独立窗口</text>
<path d="M1130 909 H1066" class="read"/>
<path d="M770 950 V999" class="flow"/>
<rect x="475" y="1000" width="905" height="58" rx="12" class="activation"/>
<text x="927" y="1036" class="body center" >继续后续层 → LM Head → 下一个 Token 的预测分布</text>
<rect x="44" y="1090" width="1352" height="44" rx="12" class="operation"/>
<text x="720" y="1119" class="body bold center" >全局 KV 共享一份  ·  编号按需复用或重选  ·  Q、SWA 与 Hidden State 每层独立计算</text>
<text x="44" y="1158" class="tiny" >蓝色主线：当前 Token 逐层计算；橙色箭头：读取缓存；绿色标签：本次选中的 512 个编号。层区间内仍逐层执行。</text>
</svg>
