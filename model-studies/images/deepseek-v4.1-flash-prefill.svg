<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="752" viewBox="0 0 1200 752" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V4.1 Flash 的 Prefill 数据流</title>
  <desc id="desc">首次处理 10000 个输入位置时，所有位置经过前 20 层。第 21 层 Full 使用全部 H₂₀ 投影出 10000 条全局 KV，供第 21 至 40 层共享。只有位置 9873 至 10000 继续执行后 20 层的完整计算，局部 SWA 截在该后缀内，生成供 Decode 使用的近似缓存。位置 10000 的最终 Hidden State 经过 LM Head 预测第一个输出 Token。</desc>
  <defs>
    <marker id="hidden-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#4a78ac"/>
    </marker>
    <marker id="kv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#b97328"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172b43; }
      .title { font-size: 34px; font-weight: 700; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #44586f; }
      .center { text-anchor: middle; }
      .activation { fill: #edf5ff; stroke: #80a9da; stroke-width: 2; }
      .cache { fill: #fff3e3; stroke: #d99a50; stroke-width: 2; }
      .muted { fill: #f1f4f8; stroke: #ccd5df; stroke-width: 1.5; }
      .hidden-line { fill: none; stroke: #4a78ac; stroke-width: 2.5; marker-end: url(#hidden-arrow); }
      .kv-line { fill: none; stroke: #b97328; stroke-width: 2.5; marker-end: url(#kv-arrow); }
    </style>
  </defs>

  <rect width="1200" height="752" fill="#ffffff"/>
  <text x="48" y="57" class="title">V4.1 Prefill 从哪一层开始少算？</text>
  <text x="48" y="92" class="body">以 10,000 个输入 Token 为例，假设没有可复用的缓存。</text>

  <rect x="48" y="122" width="1104" height="66" rx="12" class="activation"/>
  <text x="72" y="163" class="heading">Encoder · 第 1–20 层</text>
  <text x="1128" y="162" class="body" text-anchor="end">全部 10,000 个位置完整计算，得到各位置的 H₂₀</text>

  <path d="M278 188 V210" class="hidden-line"/>
  <path d="M945 188 V210" class="hidden-line"/>
  <rect x="48" y="212" width="664" height="78" rx="12" class="muted"/>
  <text x="72" y="243" class="heading">H₂₀ · 位置 1–9872</text>
  <text x="72" y="271" class="small">这些位置在后半段只参与生成全局 KV</text>
  <rect x="732" y="212" width="420" height="78" rx="12" class="activation"/>
  <text x="756" y="243" class="heading">H₂₀ · 位置 9873–10000</text>
  <text x="756" y="271" class="small">这些位置也继续做后半段的完整计算</text>

  <path d="M780 290 V314 H278" fill="none" stroke="#b97328" stroke-width="2.5"/>
  <path d="M278 290 V363" class="kv-line"/>
  <circle cx="278" cy="314" r="4" fill="#b97328"/>
  <text x="298" y="347" class="small">全部位置的 H₂₀</text>
  <path d="M945 290 V363" class="hidden-line"/>
  <text x="965" y="340" class="small">末尾 128 个位置</text>

  <rect x="48" y="365" width="458" height="171" rx="12" class="cache"/>
  <text x="72" y="406" class="heading">第 21 层 Full 的全局 KV 投影</text>
  <text x="72" y="449" class="body">保存 10,000 条全局 KV</text>
  <text x="72" y="487" class="small">覆盖全部输入位置，供第 21–40 层共用</text>
  <path d="M506 455 H593" class="kv-line"/>
  <text x="550" y="429" class="small center">读取</text>

  <rect x="595" y="365" width="557" height="171" rx="12" class="activation"/>
  <text x="619" y="406" class="heading">Decoder · 第 21–40 层</text>
  <text x="619" y="449" class="body">末尾 128 个位置完整跑 Attention 和 MoE</text>
  <text x="619" y="487" class="small">各层联合读取全局 KV 和本层 SWA</text>
  <text x="619" y="515" class="small">SWA 的可见位置从 9873 起算</text>

  <path d="M718 536 V572" class="kv-line"/>
  <path d="M1010 536 V572" class="hidden-line"/>
  <rect x="595" y="574" width="246" height="72" rx="12" class="cache"/>
  <text x="718" y="605" class="body center">各层的局部 SWA KV</text>
  <text x="718" y="631" class="small center">供后续 Decode 使用</text>
  <rect x="861" y="574" width="291" height="72" rx="12" class="activation"/>
  <text x="1006" y="605" class="body center">位置 10000 的最终 H₄₀</text>
  <text x="1006" y="631" class="small center">LM Head 预测首个输出 Token</text>

  <line x1="48" y1="679" x2="1152" y2="679" stroke="#ccd5df" stroke-width="1.5"/>
  <text x="48" y="711" class="small">有界回放把局部注意力限制在这段后缀内，生成近似的 SWA 缓存。</text>
  <text x="48" y="736" class="small">例如位置 9873 在第 22 层仍可从全局池选取旧位置，但它在局部窗口内只能看自己。</text>
</svg>
