<svg xmlns="http://www.w3.org/2000/svg" width="680" height="332" viewBox="0 0 680 332" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek-V3 · MLA 逐层执行</title>
  <desc id="desc">以单样本、100 个 Token 的 Prefill 为例。各层之间传递形状为 [1, 100, 7168] 的 Hidden State。每层独立执行 MLA 并读写本层缓存，分别保存形状为 [1, 100, 512] 的 KV latent 和 [1, 100, 64] 的 RoPE Key。</desc>
  <defs>
    <style>
      text { font-family: Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #172b43; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-weight: 700; text-anchor: middle; }
      .detail { text-anchor: middle; }
      .shape { fill: #2a568a; }
      .cache-text { fill: #87470d; }
      .block { fill: #edf5ff; stroke: #79a5dd; }
      .cache { fill: #fff3e3; stroke: #df9a47; }
      .hidden-flow { fill: none; stroke: #3868a5; stroke-width: 2; }
      .cache-flow { fill: none; stroke: #a85b13; stroke-width: 2; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="680" height="332" rx="14" fill="#fff"/>
  <text x="32" y="38" class="title">DeepSeek-V3 · MLA 逐层执行</text>

  <path d="M160 54 V80 M160 154 V196 M160 270 V304" class="hidden-flow"/>
  <path d="M155 77 H165 L160 86 Z M155 193 H165 L160 202 Z M155 301 H165 L160 310 Z" fill="#3868a5"/>
  <text x="178" y="72" class="shape">Hidden State [1, 100, 7168]</text>
  <text x="178" y="183" class="shape">Hidden State [1, 100, 7168]</text>
  <text x="178" y="299" class="shape">继续传给后续层</text>

  <rect x="32" y="86" width="256" height="68" rx="10" class="block"/>
  <text x="160" y="115" class="label">第 1 层 Transformer Block</text>
  <text x="160" y="138" class="detail">MLA</text>
  <rect x="392" y="86" width="256" height="68" rx="10" class="cache"/>
  <text x="520" y="115" class="label">第 1 层 KV Cache</text>
  <text x="520" y="138" class="detail cache-text">[1, 100, 512] + [1, 100, 64]</text>
  <path d="M303 126 H377" class="cache-flow"/>
  <path d="M297 126 L305 122 V130 Z M383 126 L375 122 V130 Z" fill="#a85b13"/>
  <text x="340" y="112" class="detail cache-text">读 / 写</text>

  <rect x="32" y="202" width="256" height="68" rx="10" class="block"/>
  <text x="160" y="231" class="label">第 2 层 Transformer Block</text>
  <text x="160" y="254" class="detail">MLA</text>
  <rect x="392" y="202" width="256" height="68" rx="10" class="cache"/>
  <text x="520" y="231" class="label">第 2 层 KV Cache</text>
  <text x="520" y="254" class="detail cache-text">[1, 100, 512] + [1, 100, 64]</text>
  <path d="M303 242 H377" class="cache-flow"/>
  <path d="M297 242 L305 238 V246 Z M383 242 L375 238 V246 Z" fill="#a85b13"/>
  <text x="340" y="228" class="detail cache-text">读 / 写</text>
</svg>
