<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1345" viewBox="0 0 1600 1345" role="img" aria-labelledby="title desc">
<title id="title">Prefill 与 Decode 的计算流程</title>
<desc id="desc">输入ABC后，两个Block分别计算三行Hidden States并保存KV。C的最终向量经LM Head选择D。下一步输入D，各层读取历史KV并追加D的KV，计算D的一行Hidden State，再选择E。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#64748b" /></marker>
<marker id="cache-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#c78336" /></marker>
<style>
text{font-family:Arial,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43}
.title{font-size:35px;font-weight:700}.section{font-size:28px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#53657a}.tiny{font-size:19px;fill:#53657a}
.center{text-anchor:middle}.bold{font-weight:700}.num{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:23px}
.panel{fill:#fafbfd;stroke:#dce3ec;stroke-width:1.5}.activation{fill:#edf5ff;stroke:#80a9da;stroke-width:2}.cache{fill:#fff3e3;stroke:#d99a50;stroke-width:2}
.weight{fill:#edf9f1;stroke:#72b286;stroke-width:1.8}.operation{fill:#f1f4f8;stroke:#ccd5df;stroke-width:1.5}
.flow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.reuse{fill:none;stroke:#c78336;stroke-width:3;marker-end:url(#cache-arrow)}
</style></defs>
<rect width="1600" height="1345" fill="white" />

<text x="44" y="54" class="title">Prefill 与 Decode 的计算流程</text>
<text x="44" y="91" class="small">2 层 · 主干 4 维 · KV 2 维 · 词表 A B C D E</text>
<g transform="translate(0,-30)"><rect x="44" y="142" width="1512" height="80" rx="12" class="weight" />
<text x="66" y="174" class="body">Q=[0,0]；K=V=Z=[x₁,x₂]；o=可见 Z 的均值。</text>
<text x="66" y="205" class="body">Block 输出 = x + [o₁,o₂,o₁,o₂]；LM Head(x) = [0,0,0,x₂,x₁−x₂] → A B C D E</text>
<rect x="44" y="245" width="724" height="1100" rx="16" class="panel" />
<rect x="832" y="245" width="724" height="1100" rx="16" class="panel" />
<text x="406" y="286" class="section center">① Prefill · 输入 A B C</text>
<text x="1194" y="286" class="section center">② Decode · 输入 D</text>
<rect x="68" y="310" width="676" height="137" rx="12" class="activation" />
<rect x="856" y="310" width="676" height="137" rx="12" class="activation" />
<text x="406" y="343" class="body bold center">Embedding · H⁽⁰⁾ [3,4]</text>
<text x="166" y="374" class="num">A:</text>
<text x="225" y="374" class="num">[1, 0, 2, 0]</text>
<text x="166" y="403" class="num">B:</text>
<text x="225" y="403" class="num">[0, 1, 0, 2]</text>
<text x="166" y="432" class="num">C:</text>
<text x="225" y="432" class="num">[1, 1, 1, 1]</text>
<text x="1194" y="347" class="body bold center">Embedding · hᴰ⁽⁰⁾ [1,4]</text>
<text x="1194" y="388" class="num center">D: [2, 0, 1, 1]</text>
<text x="1194" y="426" class="tiny center">历史 KV：A B C　·　当前输入：D</text>
<path d="M406 447 V478" class="flow" />
<path d="M1194 447 V478" class="flow" />
<text x="406" y="507" class="body bold center">Block 1 · 从 H⁽⁰⁾ 生成 Q / KV</text>
<text x="1194" y="507" class="body bold center">Block 1 · 从 hᴰ⁽⁰⁾ 生成 Q / KV</text>
<rect x="68" y="529" width="676" height="88" rx="12" class="cache" />
<rect x="856" y="529" width="676" height="88" rx="12" class="cache" />
<text x="406" y="560" class="body bold center">KV Cache 1 · Z₁ [3,2]</text>
<text x="406" y="596" class="num center">A [1,0]   B [0,1]   C [1,1]</text>
<text x="1194" y="560" class="body bold center">Cache 1：旧 3 条 + D 的 Z₁=[2,0] → [4,2]</text>
<text x="1194" y="596" class="small center">Qᴰ=[0,0]，读取 4 条，权重各为 1/4</text>
<path d="M744 574 H855" class="reuse" />
<text x="800" y="551" class="tiny bold center">保留</text>
<rect x="68" y="638" width="676" height="140" rx="12" class="activation" />
<rect x="856" y="638" width="676" height="140" rx="12" class="activation" />
<text x="406" y="670" class="body bold center">H⁽¹⁾ [3,4]</text>
<text x="122" y="702" class="num">A:</text>
<text x="180" y="702" class="num">[2, 0, 3, 0]</text>
<text x="122" y="731" class="num">B:</text>
<text x="180" y="731" class="num">[0.5, 1.5, 0.5, 2.5]</text>
<text x="122" y="760" class="num">C:</text>
<text x="180" y="760" class="num">[1.667, 1.667, 1.667, 1.667]</text>
<text x="1194" y="673" class="body bold center">hᴰ⁽¹⁾ [1,4]</text>
<text x="1194" y="707" class="num center">oᴰ = [1, 0.5]</text>
<text x="1194" y="742" class="num center">hᴰ⁽¹⁾ = [3, 0.5, 2, 1.5]</text>
<path d="M406 778 V811" class="flow" />
<path d="M1194 778 V811" class="flow" />
<text x="406" y="839" class="body bold center">Block 2 · 从 H⁽¹⁾ 生成 Q / KV</text>
<text x="1194" y="839" class="body bold center">Block 2 · 从 hᴰ⁽¹⁾ 生成 Q / KV</text>
<rect x="68" y="861" width="676" height="89" rx="12" class="cache" />
<rect x="856" y="861" width="676" height="89" rx="12" class="cache" />
<text x="406" y="892" class="body bold center">KV Cache 2 · Z₂ [3,2]</text>
<text x="406" y="929" class="num center">A [2,0]   B [0.5,1.5]   C [1.667,1.667]</text>
<text x="1194" y="892" class="body bold center">Cache 2：旧 3 条 + D 的 Z₂=[3,0.5] → [4,2]</text>
<text x="1194" y="929" class="small center">Qᴰ=[0,0]，读取 4 条，权重各为 1/4</text>
<path d="M744 906 H855" class="reuse" />
<text x="800" y="883" class="tiny bold center">保留</text>
<rect x="68" y="971" width="676" height="140" rx="12" class="activation" />
<rect x="856" y="971" width="676" height="140" rx="12" class="activation" />
<text x="406" y="1004" class="body bold center">H⁽²⁾ [3,4]</text>
<text x="99" y="1036" class="num">A:</text>
<text x="158" y="1036" class="num">[4, 0, 5, 0]</text>
<text x="99" y="1065" class="num">B:</text>
<text x="158" y="1065" class="num">[1.75, 2.25, 1.75, 3.25]</text>
<text x="99" y="1094" class="num">C:</text>
<text x="158" y="1094" class="num">[3.056, 2.722, 3.056, 2.722]</text>
<text x="1194" y="1004" class="body bold center">hᴰ⁽²⁾ [1,4]</text>
<text x="1194" y="1040" class="num center">oᴰ = [1.792, 0.917]</text>
<text x="1194" y="1077" class="num center">hᴰ⁽²⁾ = [4.792, 1.417, 3.792, 2.417]</text>
<path d="M406 1111 V1144" class="flow" />
<path d="M1194 1111 V1144" class="flow" />
<rect x="68" y="1145" width="676" height="171" rx="12" class="operation" />
<rect x="856" y="1145" width="676" height="171" rx="12" class="operation" />
<text x="406" y="1181" class="body bold center">LM Head · 输入 hᶜ⁽²⁾</text>
<text x="406" y="1216" class="small center">词表分数 [A,B,C,D,E]</text>
<text x="406" y="1252" class="num center">[0, 0, 0, 2.722, 0.333]</text>
<text x="406" y="1291" class="body bold center">argmax → D（ID 3）</text>
<text x="1194" y="1181" class="body bold center">LM Head · 输入 hᴰ⁽²⁾</text>
<text x="1194" y="1216" class="small center">词表分数 [A,B,C,D,E]</text>
<text x="1194" y="1252" class="num center">[0, 0, 0, 1.417, 3.375]</text>
<text x="1194" y="1291" class="body bold center">argmax → E（ID 4）</text>
</g></svg>
