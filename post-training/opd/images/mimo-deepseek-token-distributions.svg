<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
<title id="title">MiMo 与 DeepSeek 的 sampled-token 和 full-vocabulary 蒸馏对比</title>
<desc id="desc">Student 对 A、B、C 的概率为 60%、30%、10%，Teacher 为 20%、70%、10%。Student 本次采到 A。左图用 A 的 logprob 差构造本次 sampled-token 蒸馏信号；右图在同一前缀上比较全部候选 Token 的分布。</desc>
<style>
text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1e293b;text-anchor:middle}
.title{font-size:27px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#64748b}.value{font-size:17px;font-weight:600}.axis{font-size:13px;fill:#94a3b8}
</style>
<rect width="1120" height="690" fill="#fff"/>
<text x="560" y="43" class="title" >MiMo 与 DeepSeek：指导信号的范围不同</text>
<text x="560" y="75" class="body" >同一个前缀，Student 本次采到 Token A</text>
<rect x="24" y="104" width="520" height="490" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="576" y="104" width="520" height="490" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="284" y="142" class="heading" >MiMo：Sampled-token</text>
<text x="836" y="142" class="heading" >DeepSeek：Full-vocabulary</text>
<text x="284" y="170" class="small" >本次用采到的 A 构造蒸馏信号</text>
<text x="836" y="170" class="small" >在这个位置比较 A、B、C 的分布</text>
<rect x="111" y="220" width="98" height="238" rx="9" fill="#ede9fe" stroke="#c4b5fd"/><rect x="149" y="188" width="14" height="14" rx="3" fill="#4f80e8"/><text x="211" y="201" class="small" >Student</text>
<rect x="295" y="188" width="14" height="14" rx="3" fill="#27a679"/><text x="360" y="201" class="small" >Teacher</text><path d="M88 424 H511" stroke="#94a3b8" stroke-width="1"/><text x="65" y="429" class="axis" >0%</text><path d="M88 329 H511" stroke="#e2e8f0" stroke-width="1"/><text x="65" y="334" class="axis" >50%</text><path d="M88 234 H511" stroke="#e2e8f0" stroke-width="1"/><text x="65" y="239" class="axis" >100%</text><rect x="124" y="310" width="32" height="114" rx="4" fill="#4f80e8"/><text x="140" y="300" class="value" >60%</text><rect x="164" y="386" width="32" height="38" rx="4" fill="#27a679"/><text x="180" y="376" class="value" >20%</text><text x="160" y="450" class="body" >A</text><rect x="268" y="367" width="32" height="57" rx="4" fill="#cbd5e1"/><text x="284" y="357" class="value" style="fill:#94a3b8">30%</text><rect x="308" y="291" width="32" height="133" rx="4" fill="#dbe2e9"/><text x="324" y="281" class="value" style="fill:#94a3b8">70%</text><text x="304" y="450" class="body" >B</text><rect x="412" y="405" width="32" height="19" rx="4" fill="#cbd5e1"/><text x="428" y="395" class="value" style="fill:#94a3b8">10%</text><rect x="452" y="405" width="32" height="19" rx="4" fill="#dbe2e9"/><text x="468" y="395" class="value" style="fill:#94a3b8">10%</text><text x="448" y="450" class="body" >C</text><text x="284" y="489" class="body" >A：学生 60%，老师 20%</text><text x="284" y="518" class="body" >给出降低 A 偏好的信号</text><text x="284" y="558" class="small" >灰色 B、C 不直接用于本次 Advantage</text><rect x="663" y="220" width="386" height="238" rx="9" fill="#f0fdf4" stroke="#bbf7d0"/><rect x="701" y="188" width="14" height="14" rx="3" fill="#4f80e8"/><text x="763" y="201" class="small" >Student</text>
<rect x="847" y="188" width="14" height="14" rx="3" fill="#27a679"/><text x="912" y="201" class="small" >Teacher</text><path d="M640 424 H1063" stroke="#94a3b8" stroke-width="1"/><text x="617" y="429" class="axis" >0%</text><path d="M640 329 H1063" stroke="#e2e8f0" stroke-width="1"/><text x="617" y="334" class="axis" >50%</text><path d="M640 234 H1063" stroke="#e2e8f0" stroke-width="1"/><text x="617" y="239" class="axis" >100%</text><rect x="676" y="310" width="32" height="114" rx="4" fill="#4f80e8"/><text x="692" y="300" class="value" >60%</text><rect x="716" y="386" width="32" height="38" rx="4" fill="#27a679"/><text x="732" y="376" class="value" >20%</text><text x="712" y="450" class="body" >A</text><rect x="820" y="367" width="32" height="57" rx="4" fill="#4f80e8"/><text x="836" y="357" class="value" >30%</text><rect x="860" y="291" width="32" height="133" rx="4" fill="#27a679"/><text x="876" y="281" class="value" >70%</text><text x="856" y="450" class="body" >B</text><rect x="964" y="405" width="32" height="19" rx="4" fill="#4f80e8"/><text x="980" y="395" class="value" >10%</text><rect x="1004" y="405" width="32" height="19" rx="4" fill="#27a679"/><text x="1020" y="395" class="value" >10%</text><text x="1000" y="450" class="body" >C</text><text x="836" y="489" class="body" >比较整套选择：A、B、C</text><text x="836" y="518" class="body" >Teacher 更偏好 B，Student 更偏好 A</text><text x="836" y="558" class="small" >使用完整分布，而不只关注采到的 A</text><text x="560" y="631" class="body" >两者的回答都由 Student 生成，仍然是 on-policy。</text>
</svg>
